{% extends 'estiloGeneral.html' %}
{% load static %}

{% block title %}Agregar Noticia - {{ club.nombre }}{% endblock %}

{% block estilosExtra %}
<link rel="stylesheet" href="{% static 'css/formularioGeneral.css' %}">
{% endblock %}

{% block contenidoPrincipal %}
<main class="formulario-main">
    <div class="formulario-contenido">
        <h2>Agregar Noticia al Club: {{ club.nombre }}</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="grupo-formulario">
                <label for="titulo">
                    <input type="text" id="titulo" name="titulo" required>
                    <span>Título</span>
                </label>
            </div>
            
            <div class="grupo-formulario">
                <label for="contenido">
                    <textarea id="contenido" name="contenido" rows="5" required></textarea>
                    <span>Contenido</span>
                </label>
            </div>
            
            <div class="grupo-formulario">
                <label for="imagenes" class="btn-seleccionar-imagen">
                    Seleccionar Imagen (opcional)
                    <input type="file" id="imagenes" name="imagenes" accept="image/*" onchange="previewImage(event)">
                </label>
                <div id="imagen-preview" class="imagen-preview">
                    <!-- Previsualización de la imagen -->
                </div>
            </div>
            
            <button type="submit">Agregar Noticia</button>
        </form>
        <a href="{% url 'detalle_club' club.nombre %}" class="boton regresar">Regresar a detalles del club</a>
    </div>
</main>

<script>
    function previewImage(event) {
        const fileInput = event.target;
        const previewContainer = document.getElementById('imagen-preview');

        // Limpiar la previsualización
        previewContainer.innerHTML = '';

        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Crear una imagen y agregarla al contenedor de previsualización
                const img = document.createElement('img');
                img.src = e.target.result;
                previewContainer.appendChild(img);
            }
            reader.readAsDataURL(file);
        }
    }
</script>
{% endblock %}
