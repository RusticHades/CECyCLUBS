{% extends 'estiloGeneral.html' %}
{% load static %}

{% block title %}Implementar Club{% endblock %}

{% block estilosExtra %}
<link rel="stylesheet" href="{% static 'css/formularioGeneral.css' %}">
{% endblock %}

{% block contenidoPrincipal %}
<main class="formulario-main">
    <div class="formulario-contenido">
        <h2>Implementar Club</h2>
        <form action="{% url 'implementar_solicitud' solicitud.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="grupo-formulario">
                <label for="nombre">
                    <input type="text" id="nombre" name="nombre" value="{{ solicitud.nombre }}" required>
                    <span>Nombre del club</span>
                </label>
            </div>
            <div class="grupo-formulario">
                <label for="descripcion">
                    <textarea id="descripcion" name="descripcion" rows="4" required>{{ solicitud.descripcion }}</textarea>
                    <span>Descripción del club</span>
                </label>
            </div>
            <div class="grupo-formulario">
                <label for="categoria">
                    <select id="categoria" name="categoria" required>
                        <option value="ciencia" {% if solicitud.categoria == "ciencia" %}selected{% endif %}>Ciencia</option>
                        <option value="deportes" {% if solicitud.categoria == "deportes" %}selected{% endif %}>Deportes</option>
                        <option value="arte" {% if solicitud.categoria == "arte" %}selected{% endif %}>Arte</option>
                        <option value="tecnologia" {% if solicitud.categoria == "tecnologia" %}selected{% endif %}>Tecnología</option>
                        <option value="literatura" {% if solicitud.categoria == "literatura" %}selected{% endif %}>Literatura</option>
                        <option value="musica" {% if solicitud.categoria == "musica" %}selected{% endif %}>Música</option>
                    </select>
                </label>
            </div>
            
            <div class="grupo-formulario">
                <label for="imagen" class="btn-seleccionar-imagen">
                    Seleccionar Imagen
                    <input type="file" id="imagen" name="imagen" accept="image/*" onchange="previewImage(event)">
                </label>
                <div id="imagen-preview" class="imagen-preview">
                    <!-- La imagen seleccionada se previsualizará aquí -->
                </div>
            </div>
            
            <button type="submit">Guardar Club</button>
        </form>
    </div>
</main>

<script>
    function previewImage(event) {
        const fileInput = event.target;
        const previewContainer = document.getElementById('imagen-preview');

        // Limpiar
        previewContainer.innerHTML = '';

        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Crear una imagen y agregarla al contenedor de previsualización
                const img = document.createElement('img');
                img.src = e.target.result;
                previewContainer.appendChild(img);
            }
            reader.readAsDataURL(file);
        }
    }

    // Función para validar que todos los campos estén llenos
    function validateForm(event) {
        const nombre = document.getElementById('nombre').value.trim();
        const descripcion = document.getElementById('descripcion').value.trim();
        const categoria = document.getElementById('categoria').value.trim();
        const imagen = document.getElementById('imagen').files.length;

        // Verificar si todos los campos están llenos y si se seleccionó una imagen
        if (!nombre || !descripcion || !categoria || imagen === 0) {
            event.preventDefault(); // Prevenir el envío del formulario
            alert("Por favor, complete todos los campos, incluyendo la imagen.");
        }
    }

    // Agregar un listener al formulario para validar antes de enviar
    document.querySelector('form').addEventListener('submit', validateForm);
</script>

{% if mensaje %}
    <script type="text/javascript">
        alert("{{ mensaje }}");
    </script>
{% endif %}

{% endblock %}
